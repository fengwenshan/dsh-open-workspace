name: release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 package.json.version 一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME 与 package.json version $VERSION 不一致" >&2
            exit 1
          fi

      - name: 测试客户端插件
        run: node scripts/test-client.mjs

      - name: 打包 zip
        run: |
          VERSION=$(node -p "require('./package.json').version")
          zip -r "dsh-open-workspace-${VERSION}.zip" \
            package.json cordis.patch.yml lib README.md
          unzip -l "dsh-open-workspace-${VERSION}.zip"

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: dsh-open-workspace ${{ github.ref_name }}
          files: dsh-open-workspace-*.zip
          generate_release_notes: true
          prerelease: false

      # 国内直连 GitHub 慢/不稳：ws-workbench「设置 → 资源」默认从 Gitee raw 下 zip。
      # 仓库没配 GITEE_TOKEN secret 时跳过（客户端自动回退 GitHub Release）。
      - name: 发布到 Gitee（dist 分支，国内下载加速）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::没配 GITEE_TOKEN secret，跳过 Gitee 镜像（国内用户会回退 GitHub 下载）"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          GITEE_URL="https://oauth2:${GITEE_TOKEN}@gitee.com/feng_wenshan/dsh-open-workspace.git" \
            bash scripts/publish-gitee.sh --version "$VERSION"

      - name: 同步源码到 Gitee
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then exit 0; fi
          git push --force \
            "https://oauth2:${GITEE_TOKEN}@gitee.com/feng_wenshan/dsh-open-workspace.git" \
            HEAD:main "refs/tags/v*:refs/tags/v*"
